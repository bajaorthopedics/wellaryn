<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00C896" />
  <title>Wellaryn — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #f2f2f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, hsla(152, 68%, 52%, 0.06) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, hsla(225, 60%, 40%, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 40px hsla(152, 68%, 52%, 0.2);
    }

    .logo img {
      width: 100%;
      height: 100%;
    }

    .card {
      background: hsla(225, 15%, 12%, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid hsla(0, 0%, 100%, 0.08);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
    }

    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.8;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: hsla(0, 0%, 100%, 0.5);
      margin-bottom: 0.5rem;
    }

    .sync-message {
      font-size: 0.8125rem;
      color: hsla(0, 0%, 100%, 0.35);
      margin-top: 1rem;
      line-height: 1.6;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: hsla(152, 68%, 52%, 0.3);
      margin: 1.25rem auto;
      border-radius: 2px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      color: #0a0a0f;
      background: #00C896;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 20px hsla(152, 68%, 52%, 0.25);
    }

    .retry-btn:hover {
      background: #00a87e;
      transform: translateY(-1px);
      box-shadow: 0 0 30px hsla(152, 68%, 52%, 0.35), 0 4px 15px hsla(152, 68%, 52%, 0.2);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .brand {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: hsla(0, 0%, 100%, 0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Pulse animation for offline icon */
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }

    .offline-icon {
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/icons/icon.svg" alt="Wellaryn" />
    </div>

    <div class="card">
      <div class="offline-icon">📡</div>

      <!-- English -->
      <h1>You're offline</h1>
      <p class="subtitle">No hay conexión a internet</p>

      <div class="divider"></div>

      <p class="sync-message">
        Your data will sync when you reconnect.<br />
        <span style="color: hsla(0,0%,100%,0.3);">Tus datos se sincronizarán cuando te reconectes.</span>
      </p>

      <button class="retry-btn" onclick="window.location.reload()">
        ↻ Retry / Reintentar
      </button>
    </div>

    <p class="brand">Wellaryn</p>
  </div>
</body>
</html>
